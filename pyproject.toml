[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maxbound"
version = "0.1.0"
description = "Sound formal upper bound on model-vs-compiler output discrepancy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kainat Bibi" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maxbound*"]

